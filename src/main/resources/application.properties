spring.application.name=obras-backend

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/obras_db
spring.data.mongodb.database=obras_db

# Server
server.port=8080

# Mail (opcional - configura con tus datos)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tu_email@gmail.com
spring.mail.password=tu_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logs
logging.level.com.obras=DEBUG
